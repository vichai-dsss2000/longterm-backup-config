version: '3.8'

services:
  # Backend API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: backup-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./longterm_backup_config.db
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-real-secret-key-32chars}
      - DEVICE_ENCRYPTION_KEY=${DEVICE_ENCRYPTION_KEY:-change-this-to-a-real-encryption-key}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000,http://localhost:8000
      - MAX_CONCURRENT_BACKUPS=5
      - BACKUP_STORAGE_PATH=/app/backups
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    volumes:
      - ./api:/app
      - backup-data:/app/backups
      - api-logs:/app/logs
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=http://api:8000/api
    container_name: backup-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=http://api:8000/api
    depends_on:
      - api
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:1.25-alpine
    container_name: backup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - backup-network
    profiles:
      - production

  # Optional: Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: backup-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    profiles:
      - production

networks:
  backup-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  backup-data:
    driver: local
  api-logs:
    driver: local
  nginx-logs:
    driver: local
  redis-data:
    driver: local
