version: '3.8'

services:
  # Backend API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: backup-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://backupuser:${DB_PASSWORD}@db:3306/backup_system
      - SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=http://localhost:3001,http://frontend
      - MAX_CONCURRENT_BACKUPS=5
      - BACKUP_STORAGE_PATH=/app/backups
      - LOG_LEVEL=INFO
    volumes:
      - ./api:/app
      - backup-data:/app/backups
      - api-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backup-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: backup-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=backup_system
      - MYSQL_USER=backupuser
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=200
      --innodb_buffer_pool_size=256M

  # Optional: Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:1.25-alpine
    container_name: backup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - backup-network
    profiles:
      - production

  # Optional: Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: backup-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backup-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    profiles:
      - production

networks:
  backup-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  backup-data:
    driver: local
  api-logs:
    driver: local
  nginx-logs:
    driver: local
  redis-data:
    driver: local
